# Place this file at the ROOT of your repo (next to app/ and server/ folders) —
# not inside app/ itself. Netlify reads it from the repo root by default.

[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

# React Router uses client-side routing (e.g. /requirements, /test-planning).
# Without this rule, refreshing any page except "/" gives a 404, because
# Netlify would otherwise look for a real file at that path on the server.
# This tells Netlify: for any path that doesn't match a real file, serve
# index.html instead and let React Router handle the routing in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
