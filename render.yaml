# Place this file at the ROOT of your repo (next to app/ and server/ folders).
# In Render: New → Blueprint → connect your repo → it reads this automatically.
#
# Secrets (marked "sync: false" below) are NOT stored in this file — Render
# will prompt you to type them into its dashboard instead, so nothing sensitive
# ever gets committed to git.

services:
  - type: web
    name: heliosqe-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://heliosqe.netlify.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
